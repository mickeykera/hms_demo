# Free tier: no credit card, no persistent disk.
#
# Render's Free plan has an ephemeral filesystem, so /data is wiped on every
# redeploy, restart, and spin-down. That is fine for a demo because
# SEED_DEMO_DATA=true re-seeds the database on every boot, so visitors always
# get a freshly populated system. Records do not survive a redeploy.
#
# A persistent disk is only available on paid plans; adding a `disk:` block
# here makes Blueprint creation fail on the Free plan.
services:
  - type: web
    name: hms-demo
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_PATH
        value: /data/hospital.db
      - key: UPLOAD_DIR
        value: /data/uploads/documents
      - key: SEED_DEMO_DATA
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      # Required: the password used to seed the demo accounts in production.
      # src/config/seed.js refuses to run when NODE_ENV=production without it,
      # and also refuses it if it equals one of the default demo passwords
      # (username as password). generateValue keeps the secret out of git.
      - key: SEED_DEMO_PASSWORD
        generateValue: true
      # WARNING -- THIS GIVES EVERY VISITOR A LOGGED-IN DEMO SESSION.
      #
      # With DEMO_QUICK_LOGIN=true, POST /api/auth/demo-login hands out a valid
      # token for any of the ten seeded demo usernames (including superadmin)
      # with no password at all. The endpoint is only allow-listed to those demo
      # accounts and is rate limited, but "rate limited" still means anyone who
      # can reach the URL can walk into an Admin session.
      #
      # That is an acceptable trade for a public demo and is unacceptable
      # anywhere real patient data exists. Set it to false (or remove it) for any
      # real deployment. Normal /api/auth/login and the SEED_DEMO_PASSWORD
      # requirement are unaffected either way.
      - key: DEMO_QUICK_LOGIN
        value: "true"
