# Free tier: no credit card, no persistent disk.
#
# Render's Free plan has an ephemeral filesystem, so /data is wiped on every
# redeploy, restart, and spin-down. That is fine for a demo because
# SEED_DEMO_DATA=true re-seeds the database on every boot, so visitors always
# get a freshly populated system. Records do not survive a redeploy.
#
# A persistent disk is only available on paid plans; adding a `disk:` block
# here makes Blueprint creation fail on the Free plan.
services:
  - type: web
    name: hms-demo
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_PATH
        value: /data/hospital.db
      - key: UPLOAD_DIR
        value: /data/uploads/documents
      - key: SEED_DEMO_DATA
        value: "true"
      - key: JWT_SECRET
        generateValue: true
